<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue-1: #1E7FFF; --blue-2: #7EB8FF;
    --ink: #1C2B36; --soft: #8FA3B0; --line: #EAF0F5; --bg: #FFFFFF; --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--ink);
    display: flex; justify-content: center; -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 100%; max-width: 440px; min-height: 100vh; position: relative;
    display: flex; flex-direction: column; padding: 22px 22px 320px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar .spacer { width: 30px; height: 30px; }
  .topbar .title { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 2px; font-size: 14px; }

  .milestone-bar {
    text-align: center; margin-top: 14px; padding: 10px 16px; border-radius: 12px;
    background: #F3F8FF; border: 1px solid #E0EDFF;
  }
  .milestone-bar .milestone-label {
    font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; color: var(--soft); margin-bottom: 2px;
  }
  .milestone-bar .milestone-text {
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; color: var(--blue-1);
  }

  /* Compact date/greeting line — was a big hero block, now just a small header
     above the conversation, since the conversation is the main event now. */
  .datebar { text-align: center; margin-top: 18px; }
  .datebar .today {
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10.5px;
    letter-spacing: 1.4px; text-transform: uppercase; color: var(--blue-1);
  }

  /* Context chips — condensed replacement for the old full-width commitment
     strip + focus card. Small, glanceable, not the headline anymore. */
  .context-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px;
    background: #F3F8FF; border: 1px solid #E0EDFF; font-size: 11.5px; color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .chip.clickable { cursor: pointer; user-select: none; }
  .chip .chip-label { font-weight: 600; color: var(--blue-1); }
  .parked-list { display: none; margin-top: 8px; width: 100%; }
  .parked-list.open { display: block; }
  .parked-list .parked-item { font-size: 12.5px; color: #405260; padding: 4px 0; }

  .focus-mini { margin-top: 10px; }
  .focus-mini .focus-mini-title {
    font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--soft); margin-bottom: 4px;
  }
  .task { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 13px; color: #405260; cursor: pointer; user-select: none; }
  .task .tick { width: 15px; height: 15px; border: 1.6px solid #CBD8E1; border-radius: 5px; flex-shrink: 0; }
  .task.done .tick { background: var(--blue-1); border-color: var(--blue-1); position: relative; }
  .task.done .tick::after {
    content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 7px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .task.done span { color: #A9B7C1; text-decoration: line-through; }
  .task .protected-flag {
    font-family: 'Inter', sans-serif; font-size: 8.5px; font-weight: 600; color: var(--blue-1);
    background: #F3F8FF; border-radius: 999px; padding: 2px 6px; margin-left: auto; text-transform: uppercase;
  }
  .empty { color: var(--soft); font-size: 12.5px; padding: 4px 0; }

  .carry-forward-card {
    margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: #FFF8F0;
    border: 1px solid #F5E6D3; font-size: 12.5px; color: #6B4C2A;
  }
  .carry-forward-card .cf-label {
    font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase; color: #C4884D; margin-bottom: 4px;
  }
  .carry-forward-card .cf-task { font-weight: 500; margin: 4px 0; }
  .carry-forward-card .cf-actions { display: flex; gap: 8px; margin-top: 8px; }
  .carry-forward-card .cf-btn {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; border: none;
    border-radius: 999px; padding: 5px 14px; cursor: pointer;
  }
  .cf-btn.confirm { background: var(--blue-1); color: #fff; }
  .cf-btn.dismiss { background: #F4F8FB; color: var(--soft); }

  /* Conversation thread — now the main, dominant surface. */
  .thread { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.45; }
  .msg .msg-label {
    display: block; font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.55; margin-bottom: 3px;
  }
  .msg.you { align-self: flex-end; background: var(--blue-1); color: #fff; border-bottom-right-radius: 4px; }
  .msg.you .msg-label { color: #EAF3FF; }
  .msg.maya { align-self: flex-start; background: #F3F8FF; color: var(--ink); border-bottom-left-radius: 4px; }
  .msg.maya .msg-label { color: var(--blue-1); }

  .hero-wrap {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 440px; height: 260px; pointer-events: none;
    display: flex; justify-content: center; align-items: flex-end; overflow: hidden; z-index: 1;
  }
  .semi {
    width: 300px; height: 300px; border-radius: 50%;
    background: linear-gradient(180deg, var(--blue-1) 0%, var(--blue-2) 100%);
    position: relative; transform: translateY(50%); transition: transform 0.4s ease;
  }
  .semi::before, .semi::after { content: ""; position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.22); }
  .semi::before { inset: 34px; }
  .semi::after { inset: 74px; border-color: rgba(255,255,255,0.16); }
  .semi.speaking { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { transform: translateY(50%) scale(1); }
    50% { transform: translateY(50%) scale(1.045); }
  }
  .ripple {
    position: absolute; left: 50%; top: 0; width: 300px; height: 300px;
    border-radius: 50%; border: 2px solid var(--blue-1); transform: translate(-50%, 0); opacity: 0;
  }
  .semi.speaking ~ .ripple { animation: ripple 2.4s ease-out infinite; }
  .semi.speaking ~ .ripple.r2 { animation-delay: 1.2s; }
  @keyframes ripple {
    0% { transform: translate(-50%, 50%) scale(0.9); opacity: 0.5; }
    100% { transform: translate(-50%, 20%) scale(1.4); opacity: 0; }
  }
  .semi.preparing { animation: prep-pulse 1.1s ease-in-out infinite; }
  @keyframes prep-pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  @media (prefers-reduced-motion: reduce) { .semi.speaking, .semi.speaking ~ .ripple, .semi.preparing { animation: none; } }

  .dock {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 440px; padding: 0 22px; display: flex; align-items: center; gap: 12px; z-index: 3;
  }
  .home-btn {
    width: 46px; height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--blue-1); background: transparent; border: none; cursor: pointer;
  }
  .inputbar {
    flex: 1; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px;
    padding: 12px 18px; box-shadow: 0 8px 30px -10px rgba(28,43,54,0.22); border: 1px solid #EEF3F7;
  }
  .inputbar input { border: none; outline: none; flex: 1; font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--ink); background: transparent; }
  .inputbar input::placeholder { color: #AEBCC6; }
  .inputbar .spark { color: var(--blue-1); display: flex; cursor: pointer; }
  .demo {
    position: fixed; top: 18px; right: 18px; z-index: 5; font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 600; color: var(--blue-1); background: #F3F8FF; border: none;
    border-radius: 999px; padding: 7px 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="phone">
    <button class="demo" id="demoBtn">▶ Preview Maya</button>

    <div class="topbar">
      <div class="spacer"></div>
      <div class="title" id="topTitle">MY DAY</div>
      <div class="spacer"></div>
    </div>

    <div class="datebar">
      <div class="today" id="todayLine">SUNDAY, 5 JULY</div>
    </div>

    <div class="milestone-bar" id="milestoneBar" style="display:none">
      <div class="milestone-label">Milestone countdown</div>
      <div class="milestone-text" id="milestoneText"></div>
    </div>

    <div class="context-row">
      <div class="chip"><span class="chip-label">On now:</span> <span id="onNowText">Nothing committed yet</span></div>
      <div class="chip clickable" id="parkedChip" style="display:none"><span id="parkedCountText"></span></div>
    </div>
    <div class="parked-list" id="parkedList"></div>

    <div class="focus-mini">
      <div class="focus-mini-title" id="focusTitle">Right now</div>
      <div id="focusList"></div>
    </div>

    <div class="thread" id="thread"></div>
  </div>

  <div class="hero-wrap">
    <div class="semi" id="semi"></div>
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
  </div>

  <div class="dock">
    <button class="home-btn" id="homeBtn" title="Back to top">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
    <div class="inputbar">
      <input id="msgInput" type="text" placeholder="Tell me an excuse, or ask…" />
      <div class="spark" id="sparkBtn" title="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </div>
    </div>
  </div>

<script>
  (function () {
    const now = new Date();
    const days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    const months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
    document.getElementById("todayLine").textContent = days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
  })();

  function timeGreeting() {
    const h = new Date().getHours();
    if (h >= 12 && h < 17) return "Good afternoon";
    if (h >= 17 || h < 4) return "Good evening";
    return "Good morning";
  }

  // ---- Conversation thread — now the primary surface, not a side effect. ----
  const threadEl = document.getElementById("thread");
  function addMessage(who, text) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.innerHTML = `<span class="msg-label">${who === "you" ? "You" : "Maya"}</span>${text}`;
    threadEl.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  // ---- Context chips: active commitment + parked threads ----
  let parkedOpen = false;
  let lastStatus = { activeCommitment: null, parkedCount: 0, milestone: null };

  function renderStatus(data) {
    lastStatus = data;
    document.getElementById("onNowText").textContent = data.activeCommitment || "Nothing committed yet";
    if (data.milestone) {
      document.getElementById("milestoneBar").style.display = "block";
      document.getElementById("milestoneText").textContent = data.milestone;
    }
    const chip = document.getElementById("parkedChip");
    if (data.parkedCount > 0) {
      chip.style.display = "inline-flex";
      const label = data.parkedCount === 1 ? "1 parked" : `${data.parkedCount} parked`;
      document.getElementById("parkedCountText").textContent = `${label} — tap to see`;
    } else {
      chip.style.display = "none";
      document.getElementById("parkedList").classList.remove("open");
      parkedOpen = false;
    }
  }

  async function loadStatus() {
    try {
      const res = await fetch("/status");
      renderStatus(await res.json());
    } catch {
      renderStatus({ activeCommitment: null, parkedCount: 0, milestone: null });
    }
    return lastStatus;
  }

  async function toggleParkedList() {
    const list = document.getElementById("parkedList");
    parkedOpen = !parkedOpen;
    if (!parkedOpen) { list.classList.remove("open"); return; }
    try {
      const res = await fetch("/parked");
      const { parked } = await res.json();
      list.innerHTML = (parked || []).map(p => `<div class="parked-item">• ${p.thread}</div>`).join("") || '<div class="parked-item">Nothing parked.</div>';
    } catch {
      list.innerHTML = '<div class="parked-item">Couldn\'t load.</div>';
    }
    list.classList.add("open");
  }
  document.getElementById("parkedChip").addEventListener("click", toggleParkedList);

  // ---- Focus mini-list: blended Calendar/Registry/Notion items for the current window ----
  function formatWindowName(name) {
    if (!name) return "Right now";
    const clean = name.split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
    return clean.replace(/\s*Pt\d+$/i, "").replace(/\s+\d+$/, "");
  }

  let lastFocus = { windowName: null, items: [] };

  function renderFocus(windowName, items) {
    lastFocus = { windowName, items };
    document.getElementById("focusTitle").textContent = formatWindowName(windowName);
    const box = document.getElementById("focusList");
    if (!items || !items.length) {
      box.innerHTML = '<div class="empty">Nothing specific queued right now.</div>';
      return;
    }
    const sourceLabel = { calendar: "calendar", notion: "brain dump" };
    box.innerHTML = items.map(it => `
      <div class="task" data-title="${it.title.replace(/"/g, "&quot;")}" data-source="${it.source}" data-id="${it.id || ""}">
        <span class="tick"></span><span>${it.title}</span>
        ${it.class === "Protected" ? '<span class="protected-flag">protected</span>' : ""}
        ${sourceLabel[it.source] ? `<span class="protected-flag" style="color:var(--soft);background:#F4F8FB">${sourceLabel[it.source]}</span>` : ""}
      </div>`).join("");
    // Toggle behavior differs by where the item actually came from — registry
    // persists via Task Log (depth-one reveal), notion ticks the real Notion
    // checkbox, calendar is visual-only (not something this app marks "done").
    document.querySelectorAll("#focusList .task").forEach(t => {
      t.addEventListener("click", async () => {
        const source = t.dataset.source;
        if (source === "calendar") {
          t.classList.toggle("done");
          return;
        }
        t.classList.add("done");
        try {
          if (source === "notion") {
            await fetch("/task/toggle", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ source: "notion", id: t.dataset.id, done: true }),
            });
          } else {
            await fetch("/focus/toggle", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title: t.dataset.title, done: true }),
            });
          }
        } catch {
          // reload below will just show the same item again if this failed
        }
        loadFocus();
      });
    });
  }

  async function loadFocus() {
    try {
      const res = await fetch("/focus");
      const data = await res.json();
      renderFocus(data.windowName, data.items);
    } catch {
      renderFocus(null, []);
    }
    return lastFocus;
  }

  (async function init() {
    const [status, focus] = await Promise.all([loadStatus(), loadFocus()]);
    addMessage("maya", composeOpening(status, focus));
  })();


  const semi = document.getElementById("semi");
  let speakTimer = null;
  function startSpeaking(ms = 4200) {
    semi.classList.add("speaking");
    clearTimeout(speakTimer);
    speakTimer = setTimeout(() => semi.classList.remove("speaking"), ms);
  }
  document.getElementById("demoBtn").addEventListener("click", () => startSpeaking(4200));

  async function handleSend() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("you", text);

    let reply, chatData;
    try {
      const chatRes = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!chatRes.ok) throw new Error("chat failed");
      chatData = await chatRes.json();
      reply = chatData.reply;
    } catch {
      addMessage("maya", "Sorry, that didn't go through — try again?");
      return;
    }

    addMessage("maya", reply);
    if (chatData.carryForward) showCarryForwardCard(chatData.carryForward);
    loadStatus();
    loadFocus();

    // Voice generation takes real time (network round-trip + synthesis) — this
    // subtle pulse says "still working on it" instead of leaving dead air.
    semi.classList.add("preparing");
    try {
      const speakRes = await fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: reply }),
      });
      if (!speakRes.ok) throw new Error("speak failed");
      const audioBlob = await speakRes.blob();
      const audio = new Audio(URL.createObjectURL(audioBlob));
      audio.addEventListener("loadedmetadata", () => {
        semi.classList.remove("preparing");
        startSpeaking((audio.duration || 4) * 1000);
      });
      audio.addEventListener("ended", () => semi.classList.remove("speaking"));
      audio.play();
    } catch {
      semi.classList.remove("preparing");
      startSpeaking(3000);
    }
  }
  function showCarryForwardCard(cf) {
    const card = document.createElement("div");
    card.className = "carry-forward-card";
    card.innerHTML = `
      <div class="cf-label">Carry forward to Day ${cf.toDay}</div>
      <div class="cf-task">${cf.taskName}</div>
      <div style="font-size:11px;color:#8B7355;margin-top:4px">Will add a note after tomorrow's entry on Phase 1 — Zoomed In</div>
      <div class="cf-actions">
        <button class="cf-btn confirm">Confirm</button>
        <button class="cf-btn dismiss">Skip</button>
      </div>`;
    threadEl.appendChild(card);
    card.scrollIntoView({ behavior: "smooth", block: "end" });
    card.querySelector(".cf-btn.confirm").addEventListener("click", async () => {
      try {
        await fetch("/carry-forward", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ parentId: cf.parentId, afterBlockId: cf.afterBlockId, taskName: cf.taskName, fromDay: cf.fromDay, logId: cf.logId }),
        });
        card.innerHTML = '<div class="cf-label">Done</div><div class="cf-task">Added to Phase 1 — Zoomed In.</div>';
      } catch { card.innerHTML = '<div class="cf-label">Failed</div><div class="cf-task">Couldn\'t write — try again later.</div>'; }
    });
    card.querySelector(".cf-btn.dismiss")?.addEventListener("click", () => { card.remove(); });
  }

  function composeOpening(status, focus) {
    const parts = [`${timeGreeting()}, Vybes.`];
    if (status.carryForwards && status.carryForwards.length) {
      const names = status.carryForwards.map(c => c.task).join(", ");
      parts.push(`From yesterday: ${names} — still unfinished.`);
    }
    if (status.activeCommitment) {
      parts.push(`We're on "${status.activeCommitment}" right now.`);
    }
    if (focus.items && focus.items.length) {
      const names = focus.items.map(i => i.title).join(" and ");
      parts.push(`For ${formatWindowName(focus.windowName).toLowerCase()}, I've got ${names} queued.`);
    } else if (!status.activeCommitment) {
      parts.push("Nothing specific queued right now — tell me what's on your mind.");
    }
    if (status.parkedCount > 0) {
      parts.push(`${status.parkedCount} thread${status.parkedCount === 1 ? "" : "s"} still parked whenever you want them back.`);
    }
    return parts.join(" ");
  }

  document.getElementById("sparkBtn").addEventListener("click", handleSend);
  document.getElementById("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") handleSend(); });
  document.getElementById("homeBtn").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
</script>
</body>
</html>
